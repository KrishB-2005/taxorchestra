name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # The blank IRS PDFs are deliberately not vendored: they are government
      # documents reissued every tax year, and the mapping cache is keyed on the
      # file digest so a new revision is picked up on its own. Without them the
      # form tests skipif themselves and the suite goes green having proved
      # nothing, so fetch them before running rather than after.
      - name: Fetch IRS forms
        run: |
          for form in f1040 f1040sb f1040sc f1040s1 f1040s2 f1040s3 f1040sr f1040sse f2441 f8812 fw9; do
            taxorchestra fetch-form --form "$form"
          done
          ls -la data/forms

      # A skipped test is not a passing test. If the fetch above failed quietly,
      # the form tests would skipif themselves and the suite would still go
      # green, so treat any skip as a failure. pipefail matters here: without
      # it, tee would swallow a non-zero exit from pytest.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pytest -q | tee result.txt
          if grep -qE '[0-9]+ skipped' result.txt; then
            echo "::error::tests were skipped, the IRS form fixtures are probably missing"
            exit 1
          fi

      - name: Benchmark
        run: taxorchestra benchmark
