[project]
name = "taxorchestra"
version = "0.1.0"
description = "Multi-agent system that reads W-2s and 1099s and files a real IRS Form 1040 PDF end to end."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Krish Bhatt" }]
license = { text = "MIT" }

dependencies = [
  "pypdf>=4.2",
  "pydantic>=2.7",
  "typer>=0.12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
aws = ["boto3>=1.34"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
taxorchestra = "taxorchestra.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxorchestra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
